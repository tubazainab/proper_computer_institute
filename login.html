<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff &amp; Admin Login — Proper Computer Institute</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --login-primary: #4f46e5;
            --login-primary-dark: #3730a3;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(30, 27, 75) 90%);
            margin: 0;
            padding: 20px;
            color: #ffffff;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .brand-logo {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #ffffff;
            margin: 0 auto 16px;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.35);
        }
        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 6px;
            text-align: center;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 28px;
        }
        .form-label {
            color: #cbd5e1;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #818cf8;
            color: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
        }
        .btn-submit {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            border: none;
            padding: 13px;
            font-weight: 600;
            border-radius: 12px;
            font-size: 1rem;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 20px -3px rgba(79, 70, 229, 0.5);
            color: #fff;
        }
        .demo-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 14px 16px;
            margin-top: 24px;
        }
        .demo-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .demo-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .portal-back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.88rem;
            margin-top: 24px;
            transition: color 0.2s;
        }
        .portal-back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <i class="fas fa-shield-halved"></i>
        </div>
        <h2>Proper Computer</h2>
        <div class="subtitle">Admin ERP &amp; Management Portal</div>

        <form id="adminLoginForm" onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user text-primary me-1"></i> Username or Email</label>
                <input type="text" id="usernameInput" class="form-control" value="admin" required placeholder="Enter username...">
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0"><i class="fas fa-lock text-primary me-1"></i> Password</label>
                    <a href="javascript:void(0)" onclick="alert('Demo password is: admin123')" class="small text-muted text-decoration-none">Forgot?</a>
                </div>
                <input type="password" id="passwordInput" class="form-control" value="admin123" required placeholder="Enter password...">
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">
                    Keep me logged in on this browser
                </label>
            </div>

            <button type="submit" class="btn btn-submit" id="loginBtn">
                <i class="fas fa-arrow-right-to-bracket me-2"></i> Sign In to ERP Dashboard
            </button>
        </form>

        <div class="demo-box text-center">
            <div class="small text-muted mb-2"><i class="fas fa-key me-1"></i> Quick Demo Access:</div>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <button type="button" class="demo-btn" onclick="fillAndLogin('admin', 'admin123', 'Administrator')">
                    <i class="fas fa-crown text-warning me-1"></i> Admin (Default)
                </button>
                <button type="button" class="demo-btn" onclick="fillAndLogin('counselor', 'pass123', 'Counselor')">
                    <i class="fas fa-headset text-info me-1"></i> Counselor
                </button>
            </div>
        </div>

        <div class="text-center">
            <a href="index.html" class="portal-back-link">
                <i class="fas fa-arrow-left"></i> Return to Public Institute Website
            </a>
        </div>
    </div>

    <script>
        function fillAndLogin(user, pass, role) {
            document.getElementById('usernameInput').value = user;
            document.getElementById('passwordInput').value = pass;
            sessionStorage.setItem('pc_admin_logged_in', 'true');
            sessionStorage.setItem('pc_admin_role', role);
            sessionStorage.setItem('pc_admin_user', user);
            
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-2"></i> Logging in...';
            setTimeout(() => {
                window.location.href = 'admin.html';
            }, 400);
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            
            if (user && pass) {
                sessionStorage.setItem('pc_admin_logged_in', 'true');
                sessionStorage.setItem('pc_admin_role', 'Administrator');
                sessionStorage.setItem('pc_admin_user', user);
                
                const btn = document.getElementById('loginBtn');
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-2"></i> Authenticating...';
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 400);
            }
        }
    </script>
</body>
</html>
