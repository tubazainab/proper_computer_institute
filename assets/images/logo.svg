<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Base Rounded Square -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#primaryGrad)" />
    
    <!-- Laptop / Terminal Outline -->
    <path d="M26 32 H74 C76.2 32 78 33.8 78 36 V62 C78 64.2 76.2 66 74 66 H26 C23.8 66 22 64.2 22 62 V36 C22 33.8 23.8 32 26 32 Z" fill="#ffffff" fill-opacity="0.15" />
    <path d="M16 68 H84 C85.1 68 86 68.9 86 70 C86 71.1 85.1 72 84 72 H16 C14.9 72 14 71.1 14 70 C14 68.9 14.9 68 16 68 Z" fill="#ffffff" />
    
    <!-- Code Bracket / Symbol inside screen -->
    <path d="M38 43 L46 49 L38 55" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="52" y1="55" x2="62" y2="55" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="130" y="62" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#1e1b4b" letter-spacing="-0.5">
    PROPER <tspan fill="url(#primaryGrad)">COMPUTER</tspan>
  </text>
  <text x="132" y="88" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="2">
    INSTITUTE OF ADVANCED IT &amp; TECH
  </text>
</svg>
