<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=../admin.html">
    <title>Redirecting to Proper Computer Admin ERP Portal...</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        // Immediate client redirection to admin.html
        window.location.replace("../admin.html" + window.location.hash);
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }
        .redirect-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            padding: 40px 32px;
            border-radius: 20px;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            margin: 0 auto 24px;
        }
        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            margin: 0 0 10px;
            font-weight: 700;
            color: #ffffff;
        }
        p {
            color: #94a3b8;
            font-size: 0.92rem;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        .btn-launch {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
            transition: transform 0.2s ease;
        }
        .btn-launch:hover {
            transform: translateY(-2px);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h2>Opening Admin ERP Portal</h2>
        <p>Connecting to Proper Computer Institute Admin &amp; Management Dashboard...</p>
        <a href="../admin.html" class="btn-launch" id="fallbackLink">
            <i class="fas fa-arrow-right"></i> Open Admin Portal
        </a>
    </div>
</body>
</html>
