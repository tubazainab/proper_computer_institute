<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proper Computer — Page Redirection</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        // Intelligent route resolver for GitHub Pages
        (function() {
            var currentPath = window.location.pathname.toLowerCase();
            var repoPrefix = '/proper_computer_institute';
            
            // Check if user was looking for admin or management routes
            var isAdminRoute = currentPath.includes('/admin') || 
                               currentPath.includes('login') || 
                               currentPath.includes('receipt') || 
                               currentPath.includes('enquir') || 
                               currentPath.includes('admission') ||
                               currentPath.includes('salary') ||
                               currentPath.includes('report');
                               
            var target = isAdminRoute ? 'admin.html' : 'index.html';
            
            // Perform instant client redirect
            var baseUrl = window.location.origin + (currentPath.includes(repoPrefix) ? repoPrefix + '/' : '/');
            window.location.replace(baseUrl + target);
        })();
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }
        .portal-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            padding: 40px 32px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon-badge {
            width: 64px;
            height: 64px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: #818cf8;
            margin: 0 auto 20px;
        }
        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            margin: 0 0 10px;
            font-weight: 700;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 0 28px;
        }
        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-portal {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-admin {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }
        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 20px -3px rgba(79, 70, 229, 0.5);
        }
        .btn-home {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-home:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="icon-badge">
            <i class="fas fa-compass"></i>
        </div>
        <h2>Proper Computer Institute</h2>
        <p>Redirecting you to the appropriate portal. If the redirect does not happen automatically, choose a destination below:</p>
        <div class="action-btns">
            <a href="admin.html" class="btn-portal btn-admin">
                <i class="fas fa-shield-halved"></i> Launch Admin &amp; Staff ERP Portal
            </a>
            <a href="index.html" class="btn-portal btn-home">
                <i class="fas fa-graduation-cap"></i> Public Institute Website
            </a>
        </div>
    </div>
</body>
</html>
